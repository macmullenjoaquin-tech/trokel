  .btn.on { background: var(--text); box-shadow: 0 10px 30px rgba(0,0,0,.3); }

  .slider { width: 100%; margin: 16px 0 0; }
  .slider .row { display: flex; align-items: center; gap: 12px; }
  .slider .end { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .track { flex: 1; position: relative; }

  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;

const ID = [[1,0,0,0,1,0,0,0,1],[0,0,0]];
function rot(u, th) {
  const [x, y, z] = u, c = Math.cos(th), s = Math.sin(th), K = 1 - c;
  return [x*x*K+c, x*y*K-z*s, x*z*K+y*s, y*x*K+z*s, y*y*K+c, y*z*K-x*s, z*x*K-y*s, z*y*K+x*s, z*z*K+c];
}
const mulR = (a, b) => [0,1,2].flatMap((i) => [0,1,2].map((j) => a[i*3]*b[j] + a[i*3+1]*b[3+j] + a[i*3+2]*b[6+j]));
const apR = (R, p) => [R[0]*p[0]+R[1]*p[1]+R[2]*p[2], R[3]*p[0]+R[4]*p[1]+R[5]*p[2], R[6]*p[0]+R[7]*p[1]+R[8]*p[2]];
const ap = (M, p) => { const q = apR(M[0], p); return [q[0]+M[1][0], q[1]+M[1][1], q[2]+M[1][2]]; };
function hingeM(h, th) { const R = rot([h.u[0], h.u[1], 0], th); const rp = apR(R, h.p); return [R, [h.p[0]-rp[0], h.p[1]-rp[1], h.p[2]-rp[2]]]; }
const compose = (A, B) => [mulR(A[0], B[0]), ap(A, B[1])];

// u: 0 plana · 1 asa · 2 alas · 3 pestaña (con giro de la pieza)
function poseAt(u) {
  const frac = [ease(u), ease(u - 1), ease((u - 2.3) / 0.45)];
  const W = {};
  for (const p of PANELS) {
    if (!p.parent) { W[p.name] = ID; continue; }
    W[p.name] = compose(W[p.parent], hingeM(p.hinge, (p.hinge.angle * RAD) * frac[p.stage]));
  }
  return { W, frac };
}
const PIVOT = [35, 118, 20], YAW = 80 * RAD, AXIS = [Math.cos(BASE_AZ * RAD), Math.sin(BASE_AZ * RAD), 0];
const LIFT_FOLD = 14.5, LIFT_DONE = 3.3, SWING = 40, REST_FLIPPED = 0.1;
function bodyPose(u) {
  const t = u - 2;
  let e = 0, z0 = LIFT_FOLD * ease(u - 1);
  if (t > 0) {
    if (t < 0.75) { e = ease(t / 0.3); z0 = LIFT_FOLD; }
    else { e = 1 - ease((t - 0.75) / 0.25); z0 = LIFT_DONE; }
  }
  const R = mulR(rot([0, 0, 1], YAW * e), rot(AXIS, -Math.PI * e));
  const pz = PIVOT[2] + z0 * (1 - e) + REST_FLIPPED * e + SWING * Math.sin(Math.PI * e);
  const q = apR(R, PIVOT);
  return { M: [R, [PIVOT[0] - q[0], PIVOT[1] - q[1], pz - q[2]]], e };
}
function worldAt(u) {
  const { W: L, frac } = poseAt(u);
  const body = bodyPose(u);
  const W = {};
  for (const p of PANELS) W[p.name] = compose(body.M, L[p.name]);
  return { W, frac, body };
}
const outerOf = (p) => p.loops.find((l) => l.outer).pts;

// ---------- dibujo ----------
const f1 = (v) => v.toFixed(2);
const pathOfPts = (pts) => "M" + pts.map((p) => f1(p[0]) + " " + f1(p[1])).join("L") + "Z";
const shadeOf = (n) => {
  if (n[2] > 0.62) return "p-top";
  const h = Math.hypot(n[0], n[1]) || 1;
  const lit = ((n[0]*LIGHT[0] + n[1]*LIGHT[1]) / h + 1) / 2;
  return "p-s" + Math.min(3, Math.max(0, Math.floor(lit * 4)));
};
const dot = (a) => a[0]*V[0] + a[1]*V[1] + a[2]*V[2];
function panelSvg(p, M, active) {
  const R = M[0];
  const nTop = apR(R, [0, 0, 1]);
  const topFacing = dot(nTop) > 0;
  const zNear = topFacing ? T : 0, zFar = topFacing ? 0 : T;
  const sides = [], farLoops = [], nearLoops = [];
  let fill = "";
  for (const l of p.loops) {
    const near = l.pts.map(([x, y]) => iso(ap(M, [x, y, zNear])));
    const far = l.pts.map(([x, y]) => iso(ap(M, [x, y, zFar])));
    const nl = l.pts.length;
    for (let i = 0; i < nl; i++) {
      const a = l.pts[i], b = l.pts[(i + 1) % nl];
      const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
      const sg = l.sign * (l.outer ? 1 : -1);
      const n = apR(R, [sg * dy / len, -sg * dx / len, 0]);
      if (dot(n) <= 0) continue;
      sides.push('<path class="' + shadeOf(n) + '" d="' + pathOfPts([near[i], near[(i + 1) % nl], far[(i + 1) % nl], far[i]]) + '"/>');
    }
    farLoops.push(pathOfPts(far));
    nearLoops.push(pathOfPts(near));
    if (l.outer) fill = pathOfPts(near) + pathOfPts(far);
  }
  const nNear = topFacing ? nTop : nTop.map((v) => -v);
  return '<g' + (active ? ' class="folding"' : '') + '>' +
    '<path class="p-fill" d="' + fill + '"/>' + sides.join("") +
    '<path class="e-mid" d="' + farLoops[0] + '"/>' +
    '<path class="' + shadeOf(nNear) + '" fill-rule="evenodd" d="' + nearLoops.join("") + '"/>' +
    '<path class="e-hi" d="' + nearLoops.join("") + '"/></g>';
}
let pxPerUnit = 1;
function bendSvg(p, W, active) {
  const M = W[p.parent];
  const a = iso(ap(M, p.hinge.ends[0])), b = iso(ap(M, p.hinge.ends[1]));
  const d = "M" + f1(a[0]) + " " + f1(a[1]) + "L" + f1(b[0]) + " " + f1(b[1]);
  let s = '<path class="bend" d="' + d + '" style="stroke-width:' + (T * pxPerUnit).toFixed(2) + 'px"/>';
  if (active) s += '<path class="bend-hi" d="' + d + '"/>';
  return s;
}
function centroidDepth(p, M) {
  const o = outerOf(p);
  let sx = 0, sy = 0; for (const [x, y] of o) { sx += x; sy += y; }
  return dot(ap(M, [sx / o.length, sy / o.length, T / 2]));
}
function projectedBox(W) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of PANELS) for (const [x, y] of outerOf(p)) for (const z of [0, T]) {
    const [sx, sy] = iso(ap(W[p.name], [x, y, z]));
    if (sx < x0) x0 = sx; if (sx > x1) x1 = sx; if (sy < y0) y0 = sy; if (sy > y1) y1 = sy;
  }
  return { x0, y0, x1, y1 };
}
function convexHull(points) {
  const s = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (s.length < 3) return s;
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of s) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = s.length - 1; i >= 0; i--) { const p = s[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return [...lo.slice(0, -1), ...up.slice(0, -1)];
}

function minRect(hull) {
  let best = null;
  for (let i = 0; i < hull.length; i++) {
    const a = hull[i], b = hull[(i + 1) % hull.length];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    let m0 = Infinity, m1 = -Infinity, n0 = Infinity, n1 = -Infinity;
    for (const [x, y] of hull) { const s = x * ux + y * uy, t = -x * uy + y * ux; m0 = Math.min(m0, s); m1 = Math.max(m1, s); n0 = Math.min(n0, t); n1 = Math.max(n1, t); }
    const area = (m1 - m0) * (n1 - n0);
    if (!best || area < best.area) best = { area, a: m1 - m0, b: n1 - n0 };
  }
  return best;
}

// ---------- medidas del modelo plegado (rectángulo mínimo en planta) ----------
(function measure() {
  const { W } = worldAt(3);
  const pts = [], zs = [];
  for (const p of PANELS) for (const [x, y] of outerOf(p)) for (const z of [0, T]) { const q = ap(W[p.name], [x, y, z]); pts.push([q[0], q[1]]); zs.push(q[2]); }
  const best = minRect(convexHull(pts));
  const cm = (mm) => (Math.round(mm / 10 * 10) / 10).toFixed(1).replace(".", ",").replace(/,0$/, "");
  document.getElementById("dimL").firstChild.nodeValue = cm(Math.max(best.a, best.b));
  document.getElementById("dimW").firstChild.nodeValue = cm(Math.min(best.a, best.b));
  document.getElementById("dimH").firstChild.nodeValue = cm(Math.max(...zs) - Math.min(...zs));
  const flat = []; for (const p of PANELS) for (const [x, y] of outerOf(p)) flat.push([x, y]);
  const fr = minRect(convexHull(flat));
  document.getElementById("flat").textContent = cm(Math.max(fr.a, fr.b)) + " × " + cm(Math.min(fr.a, fr.b)) + " cm";
})();

// ---------- encuadre: el portamaní llena el recuadro ----------
const card = document.getElementById("card");
const svgEl = document.getElementById("view");
const sheet = document.getElementById("sheet");
const shadowEl = document.getElementById("shadow");
const foldsEl = document.getElementById("folds");
let BASE = null;
function baseBox() {
  // todas las poses sin el giro del paso 3, vistas desde todos los ángulos
  let b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  const us = []; for (let u = 0; u <= 2.0001; u += 0.1) us.push(u); us.push(3);
  for (let az = 0; az < 360; az += 15) {
    setCam(az);
    for (const u of us) {
      const q = projectedBox(worldAt(u).W);
      b = { x0: Math.min(b.x0, q.x0), y0: Math.min(b.y0, q.y0), x1: Math.max(b.x1, q.x1), y1: Math.max(b.y1, q.y1) };
    }
  }
  return b;
}
const ZOOM = 1.7;
function zoomAt(u) {
  const t = u - 2;
  if (t <= 0.18 || t >= 0.86) return 0;
  return t < 0.75 ? ease((t - 0.18) / 0.12) : 1 - ease((t - 0.75) / 0.11);
}
function frame(u, W) {
  const cw = card.clientWidth || 1, ch = card.clientHeight || 1;
  const top = 46, bottom = 82, side = 14;
  const cur = projectedBox(W);
  const b = { x0: Math.min(BASE.x0, cur.x0), y0: Math.min(BASE.y0, cur.y0), x1: Math.max(BASE.x1, cur.x1), y1: Math.max(BASE.y1, cur.y1) };
  const bw = b.x1 - b.x0, bh = b.y1 - b.y0;
  let s = Math.min((cw - side * 2) / bw, (ch - top - bottom) / bh);
  let cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  // centro del área libre (entre la etiqueta y el botón)
  const freeCy = top + (ch - top - bottom) / 2;
  let vx = cx - (cw / 2) / s, vy = cy - freeCy / s, vw = cw / s, vh = ch / s;
  const a = zoomAt(u);
  if (a > 0) {
    const tab = byName["Pestana del asa"], o = outerOf(tab);
    let sx = 0, sy = 0; for (const [x, y] of o) { sx += x; sy += y; }
    const f = iso(ap(W[tab.name], [sx / o.length, sy / o.length, T / 2]));
    const z = 1 + (ZOOM - 1) * a;
    const fcx = vx + vw / 2 + (f[0] - (vx + vw / 2)) * a, fcy = vy + vh / 2 + (f[1] - (vy + vh / 2)) * a;
    vw /= z; vh /= z; vx = fcx - vw / 2; vy = fcy - vh / 2; s *= z;
  }
  pxPerUnit = s;
  svgEl.setAttribute("viewBox", f1(vx) + " " + f1(vy) + " " + f1(vw) + " " + f1(vh));
}

// ---------- estado y textos ----------
const STEPS = [{ what: "Asa", angle: 97.5 }, { what: "Alas ×6", angle: 67 }, { what: "Pestaña", angle: 90 }];
const tagEl = document.getElementById("tag"), degEl = document.getElementById("deg");
const range = document.getElementById("range"), btn = document.getElementById("btn"), btnTxt = document.getElementById("btnTxt");
const stepEls = [...document.querySelectorAll("#steps button")];
const fmt = (v) => v.toFixed(1).replace(".", ",").replace(/,0$/, "");
let az = BASE_AZ, lastKey = "";
function draw(u) {
  const key = u.toFixed(4) + "|" + az.toFixed(2) + "|" + card.clientWidth;
  if (key === lastKey) return;
  lastKey = key;
  setCam(az);
  const { W, frac, body } = worldAt(u);
  frame(u, W);
  const step = clamp(Math.floor(u), 0, 2);
  const moving = u > 0.001 && u < 2.999 && frac[step] > 0.001 && frac[step] < 0.999;
  const up = dot(apR(W.Base[0], [0, 0, 1])) > 0;
  const tab = "Pestana del asa";
  const items = PANELS.map((p) => ({ p, key: !p.parent ? (up ? -1e9 : 1e8) : (!up && p.name === tab) ? 1e9 : centroidDepth(p, W[p.name]) }));
  items.sort((a, b) => a.key - b.key);
  const html = [];
  for (const { p } of items) {
    if (p.parent) html.push(bendSvg(p, W, p.stage === step && moving));
    html.push(panelSvg(p, W[p.name], moving && p.stage === step));
  }
  sheet.innerHTML = html.join("");
  // líneas de pliegue que faltan doblar: rojas y punteadas, se apagan al plegarse
  const fold = [];
  for (const p of PANELS) {
    if (!p.parent) continue;
    const op = (1 - frac[p.stage]) * (1 - body.e);
    if (op < 0.02 || (moving && p.stage === step)) continue;
    const M = W[p.parent];
    const [x0, y0] = p.hinge.ends[0], [x1, y1] = p.hinge.ends[1];
    const a = iso(ap(M, [x0, y0, T])), c = iso(ap(M, [x1, y1, T]));
    fold.push('<path style="opacity:' + op.toFixed(2) + '" d="M' + f1(a[0]) + ' ' + f1(a[1]) + 'L' + f1(c[0]) + ' ' + f1(c[1]) + '"/>');
  }
  foldsEl.innerHTML = fold.join("");
  // sombra sobre el piso (z = 0)
  const fl = [];
  for (const p of PANELS) for (const [x, y] of outerOf(p)) { const q = ap(W[p.name], [x, y, 0]); fl.push(iso([q[0], q[1], 0])); }
  shadowEl.setAttribute("d", pathOfPts(convexHull(fl)));
  shadowEl.style.opacity = (0.55 * (1 - body.e) * (1 - body.e)).toFixed(3);

  // textos
  let label, deg = "";
  if (u <= 0.001) label = "CHAPA <b>PLANA</b>";
  else if (u >= 2.999) label = "<b>PLEGADO</b>";
  else {
    label = "PASO " + (step + 1) + " · <b>" + STEPS[step].what.toUpperCase() + "</b>";
    deg = fmt(STEPS[step].angle * frac[step]) + "° / " + fmt(STEPS[step].angle) + "°";
  }
  if (tagEl.innerHTML !== label) tagEl.innerHTML = label;
  if (degEl.textContent !== deg) degEl.textContent = deg;
  stepEls.forEach((el, i) => el.classList.toggle("on", u > 0.001 && (i === step || u >= 2.999)));
  if (!dragging) range.value = Math.round(u * 1000);
  range.style.setProperty("--p", (u / 3 * 100).toFixed(2) + "%");
  range.setAttribute("aria-valuetext", label.replace(/<[^>]+>/g, "") + (deg ? " " + deg : ""));
  const done = target >= 3 || (target === u && u >= 2.999);
  btn.classList.toggle("on", done);
  btn.setAttribute("aria-pressed", String(done));
  btnTxt.textContent = done ? "Desplegar" : "Plegar";
}

// ---------- animación ----------
const still = matchMedia("(prefers-reduced-motion: reduce)");
const TOUR = [[0,1.2],[1,2.4],[1,0.9],[2,2.4],[2,0.9],[2.3,2.4],[2.3,0.5],[2.75,2.6],[2.75,1.4],[3,2.4],[3,2.2],[2,3.8],[0,2.6]];
const tourLen = TOUR.reduce((s, [, d]) => s + d, 0);
function tourAt(t) {
  t %= tourLen; let u0 = 0;
  for (const [u1, d] of TOUR) { if (t < d) return u0 + (u1 - u0) * (u1 === u0 ? 0 : ease(t / d)); t -= d; u0 = u1; }
  return 0;
}
let u = 0, target = 0, raf = 0, last = 0, clock = 0, touring = !still.matches, dragging = false, visible = true;
const speedAt = (v) => (v < 2 ? 0.6 : 0.26); // el paso 3 incluye el giro: va más lento
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring) { clock += dt; u = tourAt(clock); }
  else if (u !== target) {
    if (still.matches) u = target;
    else { const d = target - u, stepU = speedAt(Math.min(u, target) + 1e-6) * dt; u = Math.abs(d) <= stepU ? target : u + Math.sign(d) * stepU; }
  }
  draw(u);
  raf = visible && (touring || u !== target) ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!raf && visible) { last = 0; raf = requestAnimationFrame(tick); } };
const stopTour = () => { if (touring) { touring = false; target = u; } };

range.addEventListener("input", () => { stopTour(); dragging = true; u = target = range.value / 1000; lastKey = ""; draw(u); });
range.addEventListener("change", () => { dragging = false; });
btn.addEventListener("click", (ev) => {
  ev.stopPropagation(); stopTour();
  target = (target >= 3 || u >= 2.999) ? 0 : 3;
  run();
});

stepEls.forEach((el) => el.addEventListener("click", () => { stopTour(); target = Number(el.dataset.to); run(); }));
let azAnim = 0;
card.addEventListener("dblclick", (ev) => {
  if (ev.target.closest(".btn")) return;
  const from = az, to = BASE_AZ + Math.round((az - BASE_AZ) / 360) * 360, t0 = performance.now();
  cancelAnimationFrame(azAnim);
  const go = (now) => { const k = ease((now - t0) / 500); az = from + (to - from) * k; lastKey = ""; draw(u); if (k < 1) azAnim = requestAnimationFrame(go); };
  azAnim = requestAnimationFrame(go);
});

// girar arrastrando (dedo o mouse)
let drag = null;
card.addEventListener("pointerdown", (ev) => {
  if (ev.target.closest(".btn")) return;
  drag = { x: ev.clientX, y: ev.clientY, az, id: ev.pointerId, active: ev.pointerType === "mouse" };
  if (drag.active) { card.setPointerCapture(ev.pointerId); card.classList.add("drag"); }
});
card.addEventListener("pointermove", (ev) => {
  if (!drag || ev.pointerId !== drag.id) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!drag.active) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.active = true; card.setPointerCapture(ev.pointerId); card.classList.add("drag"); }
    else return;
  }
  az = drag.az - dx * 0.45;
  lastKey = ""; draw(u);
});
const endDrag = () => { drag = null; card.classList.remove("drag"); };
card.addEventListener("pointerup", endDrag);
card.addEventListener("pointercancel", endDrag);

new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(card);
new ResizeObserver(() => { lastKey = ""; draw(u); }).observe(card);

(function center() {
  const { W } = worldAt(3);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of PANELS) for (const [x, y] of outerOf(p)) { const q = ap(W[p.name], [x, y, 0]); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
  CX = (x0 + x1) / 2; CY = (y0 + y1) / 2;
})();
BASE = baseBox();
const padX = (BASE.x1 - BASE.x0) * 0.03, padY = (BASE.y1 - BASE.y0) * 0.03;
BASE = { x0: BASE.x0 - padX, y0: BASE.y0 - padY, x1: BASE.x1 + padX, y1: BASE.y1 + padY };
if (still.matches) u = target = 3;
draw(u);
run();
window.__pose = (v, a) => { touring = false; if (a !== undefined) az = a; target = u = v; lastKey = ""; draw(v); };
})();
</script>
</body>
</html>
